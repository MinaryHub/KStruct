name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Code signing is optional: without these repository secrets the installers are built
# unsigned, as before.
#   Windows: WINDOWS_CERT_PFX_BASE64 (base64 of the .pfx), WINDOWS_CERT_PASSWORD
#   macOS:   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY
#            ("Developer ID Application: Name (TEAMID)"); for notarization also
#            APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific password)
# A pushed tag v* publishes the installers and SHA256SUMS to a GitHub Release.

jobs:
  build:
    env:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Headless display (VTK / Qt tests)
        uses: pyvista/setup-headless-display-action@v3
        with:
          qt: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        run: uv run pytest -q

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Windows signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "kstruct.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          "KSTRUCT_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "x64" } | Select-Object -Last 1
          "KSTRUCT_SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV

      - name: macOS signing identity and notary profile
        if: runner.os == 'macOS' && env.MACOS_CERT_P12_BASE64 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/kstruct.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "KSTRUCT_MACOS_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials kstruct-notary --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$KEYCHAIN"
            echo "KSTRUCT_NOTARY_PROFILE=kstruct-notary" >> "$GITHUB_ENV"
          fi

      - name: Build (stamp version 0.x.y.<run number>, freeze, self-test, package)
        env:
          KSTRUCT_BUILD_NUMBER: ${{ github.run_number }}
          KSTRUCT_SIGN_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: uv run python packaging/build.py

      - name: GUI smoke test of the frozen app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            BIN=dist/KStruct.app/Contents/MacOS/KStruct
          elif [ "$RUNNER_OS" = "Windows" ]; then
            BIN=dist/KStruct/KStruct.exe
          else
            BIN=dist/KStruct/KStruct
          fi
          "$BIN" --selftest-gui selftest.png

      - uses: actions/upload-artifact@v4
        with:
          name: KStruct-${{ matrix.os }}
          path: |
            dist/KStruct-Setup-*.exe
            dist/KStruct-*-macOS.dmg
            dist/KStruct-*-linux-*.tar.gz
            dist/SHA256SUMS.txt
            selftest.png
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect installers and one checksum file
        run: |
          mkdir release
          find artifacts -type f \( -name 'KStruct-Setup-*.exe' -o -name '*.dmg' -o -name '*.tar.gz' \) \
            -exec cp {} release/ \;
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
