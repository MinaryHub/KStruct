name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Headless display (VTK / Qt tests)
        uses: pyvista/setup-headless-display-action@v3
        with:
          qt: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        run: uv run pytest -q

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Build (stamp version 0.x.y.<run number>, freeze, self-test, package)
        env:
          KSTRUCT_BUILD_NUMBER: ${{ github.run_number }}
        run: uv run python packaging/build.py

      - name: GUI smoke test of the frozen app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            BIN=dist/KStruct.app/Contents/MacOS/KStruct
          elif [ "$RUNNER_OS" = "Windows" ]; then
            BIN=dist/KStruct/KStruct.exe
          else
            BIN=dist/KStruct/KStruct
          fi
          "$BIN" --selftest-gui selftest.png

      - uses: actions/upload-artifact@v4
        with:
          name: KStruct-${{ matrix.os }}
          path: |
            dist/KStruct-Setup-*.exe
            dist/KStruct-*-macOS.dmg
            dist/KStruct-*-linux-*.tar.gz
            selftest.png
          if-no-files-found: error
